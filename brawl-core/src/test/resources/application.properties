# ===================================================================
# ARQUIVO DE PROPRIEDADES PARA O AMBIENTE DE TESTE COM H2
# ===================================================================

# --- Configuração do Banco de Dados H2 em Memória ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Garante que o banco seja criado do zero e destruído a cada execução da suíte de testes.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# --- Chaves de API Falsas (Dummies) ---
brawl.api.key=dummy-brawl-api-key-for-tests
discord.api.key=dummy-discord-api-key-for-tests
google.sheets.id=dummy-google-sheets-id-for-tests
google.credentials.path=dummy-path
google.credentials.path.container=/dev/null

# --- Otimização de Testes ---
# Mantemos os outros bancos desativados para acelerar os testes
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration