services:
  # ===============================================
  # SERVIÇOS DE INFRAESTRUTURA
  # ===============================================
  mysql-db:
    image: mysql:8.0
    container_name: brawl_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_BRAWL_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-cache:
    image: redis:7
    container_name: brawl_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===============================================
  # SERVIÇOS DAS SUAS APLICAÇÕES
  # ===============================================
  brawl-core-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: brawl-core
    container_name: brawl_core_app
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ${GOOGLE_CREDENTIALS_PATH}:/app/config/google-credentials.json:ro
    environment:
      - SERVER_PORT=8080
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=${DB_BRAWL_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - BRAWL_API_KEY=${BRAWL_API_KEY}
      - DISCORD_API_KEY=${DISCORD_API_KEY}
      - GOOGLE_SHEETS_ID=${GOOGLE_SHEETS_ID}
      - GOOGLE_CREDENTIALS_PATH_CONTAINER=/app/config/google-credentials.json
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  user-manager-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: brawl-web
    container_name: user_manager_app
    restart: always
    ports:
      - "8181:8081"
    environment:
      - SERVER_PORT=8081
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=${DB_USERMANAGE_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data: